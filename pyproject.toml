[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecheck"
version = "0.1.0"
description = "Estimate how vibe-coded a C/C++ project is: AI involvement vs. human oversight."
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vibecheck = "vibecheck.cli:main"

[tool.setuptools.packages.find]
include = ["vibecheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
